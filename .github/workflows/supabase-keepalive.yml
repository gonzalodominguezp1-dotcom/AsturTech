# Supabase pausa los proyectos gratuitos tras 7 días sin actividad.
# Esta tarea hace una consulta ligera cada 2 días para mantenerlo activo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar reseñas publicadas
        env:
          # Clave publicable: es pública por diseño (también va en el HTML de la web).
          SUPABASE_URL: https://wdnilvvzdjnmywptylnn.supabase.co
          SUPABASE_KEY: sb_publishable_AZEKONuh5H6_rq0JAaAeGA_V6-9pgZW
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/testimonials?select=author&limit=1" \
            -H "apikey: $SUPABASE_KEY"
